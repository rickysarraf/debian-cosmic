name: Debian COSMIC - Build Packages

on:
  push:
    branches: [ "main", "wip/*" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '59 23 * * 5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}
  BASE_VERSION: "1.11.0-1"

jobs:
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      epoch: ${{ steps.filter.outputs.epoch }}
      utils: ${{ steps.filter.outputs.utils }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Detect changed image contexts
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            epoch:
              - 'images/cosmic-epoch/**'
              - 'packaging/**'
            utils:
              - 'images/cosmic-utils/**'
              - 'packaging/**'

  resolve-pair:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      attempt: ${{ steps.resolve.outputs.attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve a verified complete package and image pair
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/package_reuse.py resolve

  # This caller and package-build.yml are fingerprinted as actual build settings.
  build-and-push:
    needs: [changes, resolve-pair]
    if: github.event.action != 'closed'
    uses: ./.github/workflows/package-build.yml
    permissions:
      contents: read
      packages: write
      actions: read
    with:
      base_version: "1.11.0-1"
      registry: ghcr.io
      image_prefix: ${{ github.repository_owner }}
      reuse_run_id: ${{ needs.resolve-pair.outputs.run_id }}
      epoch_changed: ${{ needs.changes.outputs.epoch }}
      utils_changed: ${{ needs.changes.outputs.utils }}
    secrets: inherit

  release:
    needs: [build-and-push, resolve-pair]
    if: |
      always() && needs.build-and-push.result == 'success' && needs.resolve-pair.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    permissions:
      contents: write
      actions: read
      packages: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate exactly one source pair and promote its immutable images
        id: release_meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ needs.resolve-pair.outputs.run_id }}
          SOURCE_ATTEMPT: ${{ needs.resolve-pair.outputs.attempt }}
        run: python3 ci/package_reuse.py release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling-${{ github.sha }}
          name: COSMIC Rolling Release (${{ steps.release_meta.outputs.release_version }})
          body: |
            ## 🌌 COSMIC Rolling Release
            Automatically generated build for Debian Testing/Sid.

            Package/image source: workflow run ${{ steps.release_meta.outputs.source_run_id }}.
            - **Epoch:** `${{ steps.release_meta.outputs.epoch_image }}`
            - **Utils:** `${{ steps.release_meta.outputs.utils_image }}`

            These exact images are also promoted to `:latest`.
            Download the `.deb` files below for traditional installation.
          files: ${{ env.DIST_DIR }}/*.deb
          draft: false
          prerelease: false
      - name: Setup GPG for APT Signing
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --import --batch
          gpg --armor --export > "$DIST_DIR/debian-cosmic.gpg"
      - name: Build APT Repository with reprepro
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y reprepro
          mkdir -p "$APT_REPO_DIR/conf"
          cp packaging/reprepro/conf/distributions "$APT_REPO_DIR/conf/"
          for deb in "$DIST_DIR"/*.deb; do
            reprepro -b "$APT_REPO_DIR" includedeb unstable "$deb"
          done
          if [ -f "$DIST_DIR/debian-cosmic.gpg" ]; then
            cp "$DIST_DIR/debian-cosmic.gpg" "$APT_REPO_DIR/"
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APT_REPO_DIR }}

  deploy-pages:
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
