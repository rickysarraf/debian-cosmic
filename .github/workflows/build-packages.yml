name: Debian COSMIC - Build Packages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '59 23 * * 5' # Weekly build on Friday at 23:59 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}
  BASE_VERSION: "1.0.11-1"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cosmic-epoch
            context: images/cosmic-epoch
            image: debian-cosmic-epoch
          - name: cosmic-utils
            context: images/cosmic-utils
            image: debian-cosmic-utils

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject dynamic version into packaging
        run: |
          BUILD_VERSION="${{ env.BASE_VERSION }}.build${{ github.run_number }}"
          echo "Injecting version: $BUILD_VERSION"
          # Update the main version in changelog
          sed -i "s/1.0.11-1/$BUILD_VERSION/g" ${{ matrix.context }}/packaging/debian/changelog
          # Update placeholders in control file
          sed -i "s/@VERSION@/$BUILD_VERSION/g" ${{ matrix.context }}/packaging/debian/control

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
          no-cache: true

      - name: Extract .deb artifact
        run: |
          mkdir -p dist
          docker run --rm -v $(pwd)/dist:/dist ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest cp /*.deb /dist/

      - name: Test Package Installation
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb
        
      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-deb
          path: dist/*.deb

  release:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling-${{ github.sha }}
          name: COSMIC Rolling Release (${{ github.run_id }})
          body: |
            ## 🌌 COSMIC Rolling Release
            Automatically generated build for Debian Testing/Sid.
            
            ### 🏗️ Artifacts
            - **Images:** `ghcr.io/${{ github.repository_owner }}/debian-cosmic-epoch:latest`
            - **Images:** `ghcr.io/${{ github.repository_owner }}/debian-cosmic-utils:latest`
            
            Download the `.deb` files below for traditional installation.
          files: dist/*.deb
          draft: false
          prerelease: false

      - name: Setup GPG for APT Signing
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch
          # Export public key for users
          gpg --armor --export > dist/debian-cosmic.gpg

      - name: Build APT Repository with reprepro
        run: |
          sudo apt-get update && sudo apt-get install -y reprepro
          mkdir -p repo/conf
          cp packaging/reprepro/conf/distributions repo/conf/
          
          # Add packages to reprepro
          for deb in dist/*.deb; do
            reprepro -b repo includedeb unstable "$deb"
          done
          
          # Move public key into the web root
          if [ -f dist/debian-cosmic.gpg ]; then
            cp dist/debian-cosmic.gpg repo/
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: repo
          branch: gh-pages