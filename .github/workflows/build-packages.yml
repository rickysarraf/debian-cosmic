name: Debian COSMIC - Build Packages

on:
  push:
    branches: [ "main", "wip/*" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '59 23 * * 5' # Weekly build on Friday at 23:59 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}
  BASE_VERSION: "1.5.0-3"

jobs:
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      epoch: ${{ steps.filter.outputs.epoch }}
      utils: ${{ steps.filter.outputs.utils }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed image contexts
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            epoch:
              - 'images/cosmic-epoch/**'
            utils:
              - 'images/cosmic-utils/**'

  build-and-push:
    needs: changes
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cosmic-epoch
            context: images/cosmic-epoch
            image: debian-cosmic-epoch
          - name: cosmic-utils
            context: images/cosmic-utils
            image: debian-cosmic-utils

    permissions:
      contents: read
      packages: write

    steps:
      # job-level `if:` cannot see the `matrix` context, so the per-leg
      # gating (schedule/workflow_dispatch always build; push/pull_request
      # only build the leg(s) whose context changed, so a cosmic-utils-only
      # change never forces the ~5h cosmic-epoch rebuild) is done here as a
      # step output, and every subsequent step is gated on it.
      - name: Determine whether to build this matrix leg
        id: gate
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ matrix.name }}" == "cosmic-epoch" && "${{ needs.changes.outputs.epoch }}" == "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ matrix.name }}" == "cosmic-utils" && "${{ needs.changes.outputs.utils }}" == "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.should_build == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.gate.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Free disk space
        if: steps.gate.outputs.should_build == 'true'
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          if docker info > /dev/null 2>&1; then
            docker system prune -af
          fi
          echo "Disk usage after cleanup:"
          df -h

      - name: Log in to the Container registry
        if: steps.gate.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject dynamic version into packaging
        if: steps.gate.outputs.should_build == 'true'
        run: |
          BUILD_VERSION="${{ env.BASE_VERSION }}.build${{ github.run_number }}"
          echo "Injecting version: $BUILD_VERSION"
          # Update the main version in changelog (robust matching)
          sed -i "1s/([^)]*)/($BUILD_VERSION)/" ${{ matrix.context }}/packaging/debian/changelog
          # Update placeholders in control file
          sed -i "s/@VERSION@/$BUILD_VERSION/g" ${{ matrix.context }}/packaging/debian/control

      - name: Build ${{ matrix.name }}
        if: steps.gate.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ matrix.image }}:local

      - name: Push ${{ matrix.name }} to registry
        if: steps.gate.outputs.should_build == 'true' && github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/wip/')
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest

      - name: Extract .deb artifact
        if: steps.gate.outputs.should_build == 'true'
        run: |
          mkdir -p dist
          docker run --rm -v $(pwd)/dist:/dist ${{ matrix.image }}:local sh -c "cp /*.deb /dist/"

      - name: Test Package Installation
        if: steps.gate.outputs.should_build == 'true'
        run: |
          docker run --rm -v $(pwd)/dist:/dist -e DEBIAN_FRONTEND=noninteractive debian:testing sh -c "apt-get update && apt-get install -y /dist/*.deb"
        
      - name: Upload .deb artifacts
        if: steps.gate.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-deb
          path: dist/*.deb

  release:
    needs: build-and-push
    # build-and-push may legitimately be skipped for one or both matrix legs
    # (path-filtered runs); only fail release if a leg that *did* run failed.
    if: |
      always() && needs.build-and-push.result != 'failure' && needs.build-and-push.result != 'cancelled' &&
      github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/wip/')
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Ensure both package artifacts are present for release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          has_pkg() {
            local want="$1" deb pkg
            for deb in dist/*.deb; do
              pkg="$(dpkg-deb -f "$deb" Package 2>/dev/null || true)"
              [ "$pkg" = "$want" ] && return 0
            done
            return 1
          }
          if ! has_pkg cosmic-epoch-monorepo; then
            echo "cosmic-epoch-monorepo missing from this run; downloading from latest release..."
            gh release download --repo "${{ github.repository }}" --pattern "cosmic-epoch-monorepo*.deb" --dir dist/ || true
          fi
          if ! has_pkg cosmic-utils-monorepo; then
            echo "cosmic-utils-monorepo missing from this run; downloading from latest release..."
            gh release download --repo "${{ github.repository }}" --pattern "cosmic-utils-monorepo*.deb" --dir dist/ || true
          fi
          missing=()
          has_pkg cosmic-epoch-monorepo || missing+=("cosmic-epoch-monorepo")
          has_pkg cosmic-utils-monorepo || missing+=("cosmic-utils-monorepo")
          if [ ${#missing[@]} -eq 2 ]; then
            echo "Release has no packages at all — cannot proceed." >&2
            ls -la dist/ >&2 || true
            exit 1
          elif [ ${#missing[@]} -eq 1 ]; then
            echo "::warning::Package ${missing[0]} could not be obtained (no prior release yet or download failed). Proceeding with available artifacts."
          fi

      - name: Normalize .deb filenames with package version
        run: |
          shopt -s nullglob
          for deb in dist/*.deb; do
            pkg="$(dpkg-deb -f "$deb" Package)"
            ver="$(dpkg-deb -f "$deb" Version | tr ':' '_')"
            arch="$(dpkg-deb -f "$deb" Architecture)"
            target="dist/${pkg}_${ver}_${arch}.deb"
            [ "$deb" = "$target" ] || mv "$deb" "$target"
          done

      - name: Read package version for release metadata
        id: release_meta
        run: |
          shopt -s nullglob
          debs=(dist/*.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "No .deb artifacts found in dist/" >&2
            exit 1
          fi
          # This run's version. A backfilled sibling from the previous
          # release may carry an older Version; do not fail the combo.
          rel_ver="${{ env.BASE_VERSION }}.build${{ github.run_number }}"
          echo "release_version=$rel_ver" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling-${{ github.sha }}
          name: COSMIC Rolling Release (${{ steps.release_meta.outputs.release_version }})
          body: |
            ## 🌌 COSMIC Rolling Release
            Automatically generated build for Debian Testing/Sid.
            
            ### 🏗️ Artifacts
            - **Images:** `ghcr.io/${{ github.repository_owner }}/debian-cosmic-epoch:latest`
            - **Images:** `ghcr.io/${{ github.repository_owner }}/debian-cosmic-utils:latest`
            
            Download the `.deb` files below for traditional installation.
          files: dist/*.deb
          draft: false
          prerelease: false

      - name: Setup GPG for APT Signing
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch
          # Export public key for users
          gpg --armor --export > dist/debian-cosmic.gpg

      - name: Build APT Repository with reprepro
        run: |
          sudo apt-get update && sudo apt-get install -y reprepro
          mkdir -p repo/conf
          cp packaging/reprepro/conf/distributions repo/conf/
          
          # Add packages to reprepro
          for deb in dist/*.deb; do
            reprepro -b repo includedeb unstable "$deb"
          done
          
          # Move public key into the web root
          if [ -f dist/debian-cosmic.gpg ]; then
            cp dist/debian-cosmic.gpg repo/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/

  deploy-pages:
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
